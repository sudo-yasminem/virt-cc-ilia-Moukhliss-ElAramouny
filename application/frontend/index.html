<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Calculatrice</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="calculator">
    <div class="display">...</div>

    <div class="buttons">
        <button class="btn light">%</button>
        <button class="btn light">√</button>
        <button class="btn light">CE</button>
        <button class="btn dark">C</button>

        <button class="btn">7</button>
        <button class="btn">8</button>
        <button class="btn">9</button>
        <button class="btn operator minus">−</button>

        <button class="btn">4</button>
        <button class="btn">5</button>
        <button class="btn">6</button>
        <button class="btn operator divide">÷</button>

        <button class="btn">1</button>
        <button class="btn">2</button>
        <button class="btn">3</button>
        <button class="btn operator multiply">×</button>

        <button class="btn">.</button>
        <button class="btn">0</button>
        <button class="btn equal">=</button>
        <button class="btn operator plus">+</button>
    </div>
</div>

</body>
</html>
